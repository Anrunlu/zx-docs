<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>逆序对 - 收集式直观演示</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    padding: 20px 16px 60px;
  }
  h1 {
    text-align: center;
    font-size: 24px; letter-spacing: 4px; margin: 6px 0 4px;
    color: #fbbf24;
    font-weight: 800;
  }
  .subtitle {
    text-align: center; color: #94a3b8; font-size: 13px;
    margin-bottom: 18px;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  .panel {
    background: #1e293b;
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 16px;
    border: 1px solid #334155;
  }

  /* ========= 顶部输入 ========= */
  .topbar {
    display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: center;
  }
  .topbar label { font-size: 13px; color: #94a3b8; }
  input[type=text] {
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 8px 14px; border-radius: 8px;
    font-family: 'Consolas', monospace; font-size: 15px;
    width: 260px; outline: none;
  }
  input[type=text]:focus { border-color: #fbbf24; }
  button {
    background: #334155;
    color: #e2e8f0;
    border: 1px solid #475569;
    padding: 8px 16px; border-radius: 8px;
    font-size: 13.5px; cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  button:hover:not(:disabled) { background: #475569; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary {
    background: #fbbf24; color: #1e1e1e; border: none; font-weight: 700;
  }
  button.primary:hover:not(:disabled) { background: #fcd34d; }

  .examples {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    margin-top: 10px;
  }
  .examples button { padding: 5px 11px; font-size: 12px; }

  /* ========= 主舞台 ========= */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; }
  }

  .zone {
    background: #1e293b;
    border-radius: 14px;
    padding: 18px 16px;
    border: 1px solid #334155;
    min-height: 300px;
    min-width: 0;
  }
  .zone-title {
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 2px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .zone-title .badge {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 5px;
    background: #334155;
    color: #cbd5e1;
  }

  /* ========= 原数组卡片排 ========= */
  .array-zone .cards {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: flex-start;
    padding-top: 20px;
  }
  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .card {
    min-width: 56px; height: 56px;
    padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Consolas', monospace;
    font-size: 24px; font-weight: 800;
    border-radius: 12px;
    background: #475569;
    color: #e2e8f0;
    border: 3px solid transparent;
    transition: all 0.3s cubic-bezier(.4,.2,.2,1);
  }
  .pos-label {
    font-size: 10.5px;
    color: #64748b;
    font-family: 'Consolas', monospace;
  }
  /* 状态 */
  .card.focus {
    background: #fbbf24;
    color: #1e1e1e;
    border-color: #fde68a;
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 0 20px rgba(251,191,36,0.7);
  }
  .card.scan {
    background: #ef4444;
    color: white;
    border-color: #fca5a5;
    box-shadow: 0 0 18px rgba(239,68,68,0.8);
    animation: scanPulse 0.5s ease-out;
  }
  @keyframes scanPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .card.counted {
    background: #22c55e;
    color: #052e16;
    opacity: 0.55;
  }
  .card.dim {
    opacity: 0.3;
  }
  .card.big {
    background: #f59e0b;
  }
  /* 比较符号 */
  .cmp-symbol {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    font-weight: 800;
    color: #ef4444;
    font-family: 'Consolas', monospace;
    animation: fadeInUp 0.3s ease-out;
  }
  .cmp-symbol.ok {
    color: #64748b;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translate(-50%, 8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ========= 收集区 ========= */
  .collect-zone .pairs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 200px;
    align-content: flex-start;
    padding: 4px;
  }
  .pair {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #0f172a;
    border-radius: 10px;
    padding: 4px 8px;
    border: 2px solid #ef4444;
    animation: popIn 0.35s cubic-bezier(.4,1.6,.6,1);
  }
  @keyframes popIn {
    0% { transform: scale(0.4); opacity: 0; }
    60% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); }
  }
  .pair .mini {
    min-width: 36px; min-height: 36px;
    padding: 3px;
    flex-direction: column;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Consolas', monospace;
    font-size: 17px; font-weight: 800;
    border-radius: 8px;
    background: #f59e0b;
    color: #1e1e1e;
  }
  .pair .mini.small {
    background: #ef4444;
    color: white;
  }
  .pair .gt {
    font-size: 14px;
    color: #ef4444;
    font-weight: 800;
    padding: 0 2px;
  }
  .pair .pos {
    font-size: 9px;
    color: #e2e8f0;
    font-family: 'Consolas', monospace;
    margin-top: 2px;
  }

  /* 空状态 */
  .empty-hint {
    color: #475569;
    font-size: 13px;
    text-align: center;
    padding: 60px 0;
  }

  /* ========= 计数器 ========= */
  .counter {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 20px;
    background: #1e293b;
    border-radius: 14px;
    border: 2px solid #334155;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .counter-item {
    text-align: center;
  }
  .counter-item .lbl {
    font-size: 11.5px;
    color: #94a3b8;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .counter-item .val {
    font-size: 36px;
    font-weight: 900;
    font-family: 'Consolas', monospace;
    line-height: 1;
  }
  .counter-item.found .val {
    color: #22c55e;
    text-shadow: 0 0 20px rgba(34,197,94,0.5);
  }
  .counter-item.found .val.flash {
    animation: flash 0.5s ease-out;
  }
  @keyframes flash {
    0% { transform: scale(1); color: #22c55e; }
    50% { transform: scale(1.5); color: #fbbf24; }
    100% { transform: scale(1); color: #22c55e; }
  }
  .counter-item .split {
    color: #64748b;
    font-size: 20px;
    font-weight: 300;
  }

  /* ========= 状态栏 ========= */
  .status {
    padding: 16px 20px;
    background: #1e293b;
    border-radius: 14px;
    border-left: 4px solid #fbbf24;
    font-size: 14px;
    line-height: 1.75;
    color: #cbd5e1;
    min-height: 70px;
  }
  .status b { color: #fbbf24; }
  .status .red { color: #ef4444; font-weight: 700; }
  .status .ok { color: #22c55e; font-weight: 700; }
  .status .blue { color: #60a5fa; font-weight: 700; }
  .status .pink { color: #f472b6; font-weight: 700; }
  .status .hl {
    background: #fbbf24;
    color: #1e1e1e;
    padding: 1px 8px;
    border-radius: 4px;
    font-weight: 800;
  }

  /* ========= 结果横幅 ========= */
  .result-banner {
    margin-top: 16px;
    padding: 24px;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    border-radius: 14px;
    text-align: center;
    display: none;
  }
  .result-banner.show { display: block; animation: popIn 0.5s ease-out; }
  .result-banner .label {
    font-size: 13px; color: #dcfce7; letter-spacing: 3px;
  }
  .result-banner .value {
    font-size: 52px; font-weight: 900;
    font-family: 'Consolas', monospace;
    color: white;
    margin-top: 4px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  /* 速度 */
  .speed-wrap {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #94a3b8;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    height: 4px; background: #334155;
    border-radius: 2px; outline: none;
    width: 110px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px;
    background: #fbbf24; border-radius: 50%;
    cursor: pointer;
  }
  .array-zone { overflow: auto; }
  .array-zone .cards { width: max-content; min-width: 100%; padding: 28px 8px 12px; }
  .card-wrap { flex-shrink: 0; }
  .collect-zone .pairs { max-height: 400px; overflow: auto; }
  input[type=text] { max-width: 100%; }
  .status { overflow-wrap: anywhere; }
  .zone-title { flex-wrap: wrap; gap: 8px; }
  .pair { max-width: 100%; overflow: auto; flex-shrink: 0; }
  .pair .mini { flex-shrink: 0; }
  .input-feedback { color: #fda4af; text-align: center; margin: 10px 0 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid #fbbf24; outline-offset: 3px; }
  @media (max-width: 520px) {
    body { padding: 14px 8px 24px; }
    h1 { font-size: 20px; letter-spacing: 1px; }
    .panel, .zone, .status { padding: 12px; }
    .zone { min-height: 220px; }
    button { padding: 8px 12px; }
    .counter { gap: 20px; padding: 14px; }
    .counter-item .val { font-size: 30px; }
    .empty-hint { padding: 35px 0; }
  }
</style>
</head>
<body>

<h1>逆序对 · 收集演示</h1>
<div class="subtitle">橙色卡片 = 前面的数 · 红色卡片 = 后面比它小的数 · 每凑成一对，就收进收集区</div>

<div class="wrap">

  <!-- 输入 -->
  <div class="panel">
    <div class="topbar">
      <label for="inputArr">序列</label>
      <input type="text" id="inputArr" aria-describedby="inputHint" value="5,2,3,1" spellcheck="false">
      <button class="primary" id="btnStart" onclick="startAll()">▶ 开始收集</button>
      <button id="btnPause" onclick="togglePause()" disabled>⏸ 暂停</button>
      <button id="btnStep" onclick="stepOnce()">⏭ 单步</button>
      <button id="btnReset" onclick="resetAll()">↺ 重置</button>
      <label class="speed-wrap" for="speed">
        速度
        <input type="range" id="speed" min="80" max="1500" value="600">
      </label>
    </div>
    <p class="subtitle" id="inputHint" style="margin:10px 0 0;">逗号分隔，最多10个整数；留空表示空列表。黄色框选左段元素，红色框选右段元素；取右时批量收集。</p>
    <p id="inputFeedback" class="input-feedback" role="status" hidden></p>
    <div class="examples">
      <button onclick="loadExample('5,2,3,1')">[5,2,3,1]</button>
      <button onclick="loadExample('5,4,2,6,3,1')">[5,4,2,6,3,1]</button>
      <button onclick="loadExample('2,2,1')">[2,2,1]</button>
      <button onclick="loadExample('4,3,2,1')">[4,3,2,1]</button>
      <button onclick="loadExample('1,2,3,4')">[1,2,3,4]</button>
      <button onclick="loadExample('3,-1,2,-1,0')">奇数长度与负数</button>
      <button onclick="loadExample('')">空列表</button>
      <button onclick="loadExample('7')">单元素</button>
      <button onclick="loadExample('6,1,5,2,4,3')">[6,1,5,2,4,3]</button>
    </div>
  </div>

  <!-- 舞台：左数组 + 右收集 -->
  <div class="stage">
    <!-- 左：数组 -->
    <div class="zone array-zone">
      <div class="zone-title">
        <span>原 数 组（位置固定）</span>
        <span class="badge" id="arrayBadge">就绪</span>
      </div>
      <div class="cards" id="arrayCards"></div>
    </div>

    <!-- 右：收集区 -->
    <div class="zone collect-zone">
      <div class="zone-title">
        <span>逆 序 对 收 集 区</span>
        <span class="badge" id="collectBadge">0 对</span>
      </div>
      <div class="pairs" id="pairsZone">
        <div class="empty-hint">找到的逆序对会一张张收集到这里</div>
      </div>
    </div>
  </div>

  <!-- 计数器 -->
  <div class="counter">
    <div class="counter-item found">
      <div class="lbl">已 收 集</div>
      <div class="val" id="cntTotal">0</div>
    </div>
    <div class="counter-item">
      <div class="lbl">逐 对 核 对 目 标</div>
      <div class="val" id="cntTarget" style="color:#60a5fa;">?</div>
    </div>
  </div>

  <!-- 状态 -->
  <div class="status" id="status">
    点击「▶ 开始收集」，看逆序对如何被一张张找出来并收进收集区。
  </div>

  <!-- 结果 -->
  <div class="result-banner" id="resultBanner">
    <div class="label">逆 序 对 总 数</div>
    <div class="value" id="resultValue">0</div>
  </div>

</div>

<script>
/* 分治合并使用 (value, originalIndex) 保存原始位置。
   取右侧较小元素时，一次增加左段剩余长度；收集区展开这批配对供观察。
   展示全部配对所需的存储可能为平方级，因此演示限10个元素。 */

let arr = [];
let steps = [];
let stepIdx = 0;
let timer = null;
let playing = false;
let paused = false;
let foundCount = 0;

/* 收集区元素 */
let pairs = [];

/* 卡片状态映射：pos -> 类名/标记 */
let cardState = {};   // { pos: 'focus' | 'scan' | 'counted' | 'dim' | null }
let cmpSymbol = null; // { pos, text, ok }

const arrayCardsEl = document.getElementById('arrayCards');
const pairsZone = document.getElementById('pairsZone');
const statusEl = document.getElementById('status');
const cntTotalEl = document.getElementById('cntTotal');
const cntTargetEl = document.getElementById('cntTarget');
const arrayBadge = document.getElementById('arrayBadge');
const collectBadge = document.getElementById('collectBadge');
const resultBanner = document.getElementById('resultBanner');
const resultValue = document.getElementById('resultValue');
const speedEl = document.getElementById('speed');

function getSpeed() { return parseInt(speedEl.value, 10); }

/* ============================================================
   生成步骤（分治逻辑，但输出"比较对"事件）
   ============================================================ */
/* 我们用归并分治，但把"某一步比较了位置 i 和位置 j"作为事件记下来。
   注意：这里的 i、j 是原始位置索引，通过 (value, origIdx) 对传递。 */

function generateSteps(nums) {
  const S = [];
  /* 用 (v, idx) 对表示元素，保证位置信息不丢 */
  function rec(lo, hi) {
    if (hi - lo <= 1) {
      S.push({ type: 'base', lo, hi });
      return hi === lo ? [] : [{ v: nums[lo], idx: lo }];
    }
    const mid = lo + Math.floor((hi - lo) / 2);
    S.push({ type: 'split', lo, hi, mid });
    const L = rec(lo, mid);
    const R = rec(mid, hi);

    S.push({
      type: 'merge-start',
      lo, hi, mid,
      leftCount: mid - lo,
      rightCount: hi - mid
    });

    let i = 0, j = 0;
    const merged = [];
    while (i < L.length && j < R.length) {
      /* 关键事件：比较 L[i] 和 R[j] */
      const a = L[i], b = R[j];
      const isInverse = a.v > b.v;
      S.push({
        type: 'compare',
        aPos: a.idx, aVal: a.v,
        bPos: b.idx, bVal: b.v,
        isInverse,
        delta: isInverse ? L.length - i : 0
      });
      if (isInverse) {
        /* 当前右侧元素与左段全部剩余元素构成逆序对。 */
        S.push({
          type: 'collect',
          leftLength: L.length, leftPtr: i,
          bPos: b.idx, bVal: b.v,
          batch: L.slice(i).map(a => ({
            aPos: a.idx, aVal: a.v,
            bPos: b.idx, bVal: b.v
          }))
        });
        merged.push(b);
        j++;
      } else {
        merged.push(a);
        i++;
      }
    }
    while (i < L.length) {
      S.push({ type: 'take-left', pos: L[i].idx, val: L[i].v });
      merged.push(L[i]);
      i++;
    }
    while (j < R.length) {
      S.push({ type: 'take-right', pos: R[j].idx, val: R[j].v });
      merged.push(R[j]);
      j++;
    }

    S.push({
      type: 'merge-end',
      lo, hi, mid,
      mergedItems: merged.map(x => ({ v: x.v, idx: x.idx }))
    });
    return merged;
  }
  const finalSorted = rec(0, nums.length);
  S.push({ type: 'done' });
  return S;
}

/* ============================================================
   渲染：原数组卡片
   ============================================================ */
function renderArray() {
  arrayCardsEl.innerHTML = '';
  if (arr.length === 0) {
    arrayCardsEl.innerHTML = '<div class="empty-hint">空列表 []</div>';
    return;
  }
  arr.forEach((v, pos) => {
    const wrap = document.createElement('div');
    wrap.className = 'card-wrap';
    const card = document.createElement('div');
    card.className = 'card';
    const st = cardState[pos];
    if (st) card.classList.add(st);
    card.textContent = v;
    card.dataset.pos = pos;
    wrap.appendChild(card);
    const lbl = document.createElement('div');
    lbl.className = 'pos-label';
    lbl.textContent = `位置 ${pos}`;
    wrap.appendChild(lbl);

    /* 比较符号（> 或 ≤）浮在卡片上方 */
    if (cmpSymbol && cmpSymbol.pos === pos) {
      const s = document.createElement('div');
      s.className = 'cmp-symbol' + (cmpSymbol.ok ? ' ok' : '');
      s.textContent = cmpSymbol.text;
      wrap.appendChild(s);
    }

    arrayCardsEl.appendChild(wrap);
  });
}

/* ============================================================
   渲染：收集区
   ============================================================ */
function renderPairs() {
  if (pairs.length === 0) {
    pairsZone.innerHTML = '<div class="empty-hint">找到的逆序对会一张张收集到这里</div>';
    collectBadge.textContent = '0 对';
    return;
  }
  pairsZone.innerHTML = pairs.map((p, i) => `
    <div class="pair" style="animation-delay:${Math.min(i * 0.02, 0.5)}s">
      <div class="mini">${p.aVal}<div class="pos">位置${p.aPos}</div></div>
      <span class="gt">&gt;</span>
      <div class="mini small">${p.bVal}<div class="pos">位置${p.bPos}</div></div>
    </div>
  `).join('');
  collectBadge.textContent = pairs.length + ' 对';
}

/* ============================================================
   应用步骤
   ============================================================ */
function applyStep(st) {
  /* 每次处理前，先清掉"比较符号"和一些瞬态状态 */
  if (st.type !== 'collect') {
    /* 保留 counted 状态，其他都清 */
    cmpSymbol = null;
    Object.keys(cardState).forEach(k => {
      if (cardState[k] !== 'counted') delete cardState[k];
    });
  }

  if (st.type === 'split') {
    arrayBadge.textContent = `拆分 [${st.lo},${st.hi})`;
    statusEl.innerHTML =
      `把区间 <b>[${st.lo}, ${st.hi})</b> 拆成左段 <b>[${st.lo},${st.mid})</b> ` +
      `和右段 <b>[${st.mid},${st.hi})</b>，先递归处理。`;
    return;
  }

  if (st.type === 'base') {
    arrayBadge.textContent = st.hi === st.lo ? '空列表' : `位置 ${st.lo} 单元素`;
    statusEl.innerHTML = st.hi === st.lo
      ? '空列表没有两个位置可配对，逆序对数为 <b>0</b>。'
      : `位置 <b>${st.lo}</b> 只有一个数，天然有序，逆序对数为 0。`;
    return;
  }

  if (st.type === 'merge-start') {
    arrayBadge.textContent = `合并 [${st.lo},${st.hi})`;
    statusEl.innerHTML =
      `左右两段已经各自有序，比较各自<span class="blue">第一个尚未合并的元素</span>。` +
      `取右侧较小元素时，批量统计它与左段全部剩余元素的逆序对。`;
    return;
  }

  if (st.type === 'compare') {
    /* 高亮 aPos 橙色（左段，位置靠前），bPos 红色（右段，位置靠后） */
    cardState[st.aPos] = 'focus';
    cardState[st.bPos] = 'scan';

    /* 在 aPos 卡片上方显示比较符号 */
    if (st.isInverse) {
      cmpSymbol = { pos: st.aPos, text: `${st.aVal} > ${st.bVal}`, ok: false };
      statusEl.innerHTML =
        `比较：位置 <b>${st.aPos}</b>（${st.aVal}）和位置 <b>${st.bPos}</b>（${st.bVal}），` +
        `<span class="red">${st.aVal} > ${st.bVal}</span> → 左段剩余 <b>${st.delta}</b> 个元素都大于它，下一步批量收集。`;
    } else {
      cmpSymbol = { pos: st.aPos, text: `${st.aVal} ≤ ${st.bVal}`, ok: true };
      statusEl.innerHTML =
        `比较：位置 <b>${st.aPos}</b>（${st.aVal}）和位置 <b>${st.bPos}</b>（${st.bVal}），` +
        `${st.aVal} ≤ ${st.bVal}，取左侧，不新增逆序对。` +
        (st.aVal === st.bVal ? '<br>相等时也先取左侧，严格大于才构成逆序对。' : '');
    }
    renderArray();
    return;
  }

  if (st.type === 'collect') {
    pairs.push(...st.batch);
    foundCount += st.batch.length;
    cntTotalEl.textContent = foundCount;
    cntTotalEl.classList.remove('flash');
    void cntTotalEl.offsetWidth;
    cntTotalEl.classList.add('flash');
    cmpSymbol = null;
    st.batch.forEach(p => {
      cardState[p.aPos] = 'counted';
      cardState[p.bPos] = 'counted';
    });
    renderArray();
    renderPairs();
    statusEl.innerHTML =
      `取出右段的 <span class="hl">${st.bVal}</span>（原位置 ${st.bPos}），` +
      `左段剩余 ${st.leftLength} - ${st.leftPtr} = <b>${st.batch.length}</b> 个元素都大于它。` +
      `<br>本次批量新增 <span class="red">${st.batch.length}</span> 对；配对均满足前位置 &lt; 后位置，` +
      `全部已收集 <span class="ok">${foundCount}</span> 对。`;
    return;
  }

  if (st.type === 'take-left' || st.type === 'take-right') {
    /* 顺手把没配成对的也标成已用（暗色） */
    if (cardState[st.pos] !== 'counted') {
      cardState[st.pos] = 'dim';
    }
    renderArray();
    return;
  }

  if (st.type === 'merge-end') {
    arrayBadge.textContent = `段 [${st.lo},${st.hi}) 完成`;
    statusEl.innerHTML = `区间 <b>[${st.lo},${st.hi})</b> 处理完毕，继续上一层。`;
    /* 把这一段所有卡片标成 counted（表示这一段已处理过） */
    for (let p = st.lo; p < st.hi; p++) {
      if (cardState[p] !== 'counted') cardState[p] = 'dim';
    }
    renderArray();
    return;
  }

  if (st.type === 'done') {
    finishAll();
  }
}

/* ============================================================
   播放控制
   ============================================================ */
function readInput() {
  const raw = document.getElementById('inputArr').value.trim();
  const tokens = raw ? raw.split(/[,，]/).map(s => s.trim()) : [];
  const feedback = document.getElementById('inputFeedback');
  function fail(message) {
    feedback.textContent = message;
    feedback.hidden = false;
    return null;
  }
  if (tokens.some(s => !/^[+-]?\d+$/.test(s))) return fail('请使用逗号分隔完整整数，例如 5,2,3,1。');
  if (tokens.length > 10) return fail('为清晰展示每个配对，最多输入10个整数。');
  const values = tokens.map(Number);
  if (values.some(v => !Number.isSafeInteger(v))) return fail('演示仅接受 JavaScript 安全整数范围内的整数。');
  feedback.textContent = '';
  feedback.hidden = true;
  return values;
}

function startAll() {
  if (!resetAll()) return;
  playing = true; paused = false;
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('btnStep').disabled = true;
  statusEl.innerHTML = '开始按递归合并顺序，批量收集逆序对……';
  loop();
}

function loop() {
  if (!playing || paused) return;
  timer = setTimeout(tick, getSpeed());
}

function togglePause() {
  if (!playing) return;
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '▶ 继续' : '⏸ 暂停';
  document.getElementById('btnStep').disabled = !paused;
  if (!paused) loop();
  else if (timer) { clearTimeout(timer); timer = null; }
}

function stepOnce() {
  if (playing && !paused) return;
  if (!playing) {
    if (!resetAll()) return;
    playing = true;
    paused = true;
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnPause').disabled = false;
    document.getElementById('btnPause').textContent = '▶ 继续';
  }
  if (timer) { clearTimeout(timer); timer = null; }
  tick();
}

function tick() {
  if (timer) { clearTimeout(timer); timer = null; }
  if (stepIdx >= steps.length) { finishAll(); return; }
  const st = steps[stepIdx++];
  applyStep(st);
  loop();
}

function finishAll() {
  playing = false; paused = false;
  if (timer) { clearTimeout(timer); timer = null; }
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnStep').disabled = true;
  document.getElementById('btnPause').textContent = '⏸ 暂停';

  cntTotalEl.textContent = foundCount;
  resultBanner.classList.add('show');
  resultValue.textContent = foundCount;

  arrayBadge.textContent = '完成';
  statusEl.innerHTML =
    `<span class="ok">全部收集完毕！</span> 逆序对总数 = <span class="hl">${foundCount}</span>。` +
    `每一对都满足原位置在前、数值严格更大。` +
    (foundCount === Number(cntTargetEl.textContent)
      ? `<br><span class="ok">与逐对核对目标一致。</span>`
      : `<br><span class="red">与逐对核对目标不一致，请检查演示步骤。</span>`);
  renderPairs();
}

function resetAll() {
  const newArr = readInput();
  if (newArr === null) return false;
  playing = false; paused = false;
  if (timer !== null) { clearTimeout(timer); timer = null; }
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnStep').disabled = false;
  document.getElementById('btnPause').textContent = '⏸ 暂停';
  arr = newArr;
  steps = generateSteps(arr);
  stepIdx = 0;
  foundCount = 0;
  pairs = [];
  cardState = {};
  cmpSymbol = null;
  let target = 0;
  for (let i = 0; i < arr.length; i++)
    for (let j = i + 1; j < arr.length; j++)
      if (arr[i] > arr[j]) target++;
  cntTotalEl.textContent = '0';
  cntTargetEl.textContent = target;
  resultBanner.classList.remove('show');
  renderPairs();
  arrayBadge.textContent = '就绪';
  renderArray();
  statusEl.innerHTML = '点击“开始收集”自动演示，或点击“单步”逐步观察；取右侧较小元素时批量收集。';
  return true;
}

function loadExample(str) {
  document.getElementById('inputArr').value = str;
  resetAll();
}

/* ============================================================
   初始化
   ============================================================ */
resetAll();

window.addEventListener('pagehide', () => {
  if (timer !== null) clearTimeout(timer);
});

document.addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLElement && e.target.closest('input, button, textarea, select')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!playing) startAll();
    else togglePause();
  }
  if (e.code === 'KeyR') resetAll();
  if (e.code === 'ArrowRight' && paused) stepOnce();
});
</script>
